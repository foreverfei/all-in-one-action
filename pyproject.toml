[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "all-in-one-action"
version = "0.1.0"
description = "Counterfactual action-influence experiments for sequential all-in-one image restoration."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "Pillow>=10.0",
  "PyYAML>=6.0",
  "pandas>=2.0",
]

[project.optional-dependencies]
metrics = [
  "torch>=2.1",
  "torchvision>=0.16",
  "lpips>=0.1.4",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["lineA*", "lineB*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
