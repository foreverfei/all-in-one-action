experiment:
  id: ood_kodak24_noise_blur_instructir7d
  role: content_ood_audit
  dataset: Kodak24
  primary_executor: instructir_7d

project:
  seed: 2027
  image_size: 256
  image_preprocess: center_crop
  expected_clean_count: 24
  data_root: data/ood_kodak24_noise_blur
  output_root: outputs/ood_kodak24_noise_blur

executor:
  name: instructir
  external_repo: external/InstructIR
  config_path: external/InstructIR/configs/eval5d.yml
  image_checkpoint: external/InstructIR/models/im_instructir-7d.pt
  lm_head_checkpoint: external/InstructIR/models/lm_instructir-7d.pt
  device: cuda

baseline:
  method: InstructIR
  checkpoint_variant: 7D
  mode: frozen_sequential_actions
  prompts_file: shared/action_prompts.yaml
  compared_orders:
    - [denoise, deblur]
    - [deblur, denoise]

degradation_pairs:
  - [noise, motion_blur]

degradation_parameter_sets:
  noise:
    - {sigma: 15}
    - {sigma: 25}
    - {sigma: 50}
  motion_blur:
    - {length: 9, angle_deg: -30}
    - {length: 9, angle_deg: 30}
    - {length: 17, angle_deg: -30}
    - {length: 17, angle_deg: 30}

coupling:
  charbonnier_epsilon: 1.0e-3
  decomposition_threshold: 1.0e-7
  bootstrap_samples: 5000
  bootstrap_seed: 2027

reporting:
  primary_metric: charbonnier
  secondary_metrics: [psnr, lpips, dists]
  matched_error_bins: 3
